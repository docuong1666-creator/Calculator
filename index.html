<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="container">
        <div id="cal">
            <div id="header"><h1>Calculator</h1></div>
            <div id="display"></div>
            <div id="cal-btns">
                <div class="operate-btns">
                    <button class="operate-btn">+</button>
                    <button class="operate-btn">-</button>
                    <button class="operate-btn">*</button>
                    <button class="operate-btn">/</button>
                </div>
                <div id="number-btns">
                    <div class="numberButtonGroup1">
                        <button class="number-btn">1</button>
                        <button class="number-btn">2</button>
                        <button class="number-btn">3</button>
                    </div>
                    <div class="numberButtonGroup2">
                        <button class="number-btn">4</button>
                        <button class="number-btn">5</button>
                        <button class="number-btn">6</button>
                    </div>
                    <div class="numberButtonGroup3">
                        <button class="number-btn">7</button>
                        <button class="number-btn">8</button>
                        <button class="number-btn">9</button>
                    </div>
                    <div class="numberButtonGroup4">
                        <button class="number-btn">0</button>
                        <button class="number-btn">.</button>
                    </div>
                </div>
                <div class="operator-btns">
                    <button class="backspace-btn">BACK SPACE</button>
                    <button class="operator-btn">=</button>
                    <button class="clear-btn">CLEAR</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
